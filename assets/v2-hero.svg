<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Atef — Law. Code. Intelligence.</title>
  <desc id="desc">Luxury editorial banner featuring obsidian dark background, brushed brass typography, glowing cyan PCB circuits, rotating HUD rings, and detailed metallic scales of justice.</desc>

  <defs>
    <!-- Deep Obsidian & Warm Ambient Background -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12" />
      <stop offset="48%" stop-color="#0D1420" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <radialGradient id="warmAmbient" cx="68%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#D49B4B" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#8A5E24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanCore" cx="76%" cy="50%" r="24%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="0" />
    </radialGradient>

    <!-- Brushed Metallic Gold Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FCE4B4" />
      <stop offset="32%" stop-color="#DFB26B" />
      <stop offset="68%" stop-color="#B88742" />
      <stop offset="100%" stop-color="#F3D299" />
    </linearGradient>

    <linearGradient id="brassMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6229" />
      <stop offset="28%" stop-color="#F5D69C" />
      <stop offset="52%" stop-color="#C9984E" />
      <stop offset="78%" stop-color="#FFE6B8" />
      <stop offset="100%" stop-color="#78511E" />
    </linearGradient>

    <linearGradient id="brassVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE7BA" />
      <stop offset="45%" stop-color="#C8964B" />
      <stop offset="100%" stop-color="#6B4719" />
    </linearGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B972" stop-opacity="0" />
      <stop offset="20%" stop-color="#FCE2B0" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#C89548" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E5B972" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#C89548" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Micro Grid -->
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.85" fill="#94A3B8" opacity="0.12" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <clipPath id="bannerClip">
      <rect width="1200" height="420" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Layers -->
    <rect width="1200" height="420" fill="url(#bgBase)" />
    <rect width="1200" height="420" fill="url(#microGrid)" />
    <rect width="1200" height="420" fill="url(#warmAmbient)" />
    <rect width="1200" height="420" fill="url(#cyanCore)" />

    <!-- Subtle Architectural Framing Lines -->
    <path d="M0 78H1200M0 342H1200" stroke="#CBD5E1" stroke-opacity="0.07" stroke-width="1" />
    <path d="M46 78H165M1040 78H1154M46 342H210M910 342H1154" stroke="#DFB46E" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Background Right-Side Tech Matrix -->
    <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" fill="none">
      <path d="M980 40H1160M1020 115H1185M1060 295H1190M990 365H1170" />
      <path d="M1090 20V395M1145 55V370" />
    </g>

    <!-- Floating Golden Bokeh Particles -->
    <g fill="#FDE68A">
      <circle cx="715" cy="95" r="1.6" opacity="0.7" />
      <circle cx="695" cy="185" r="2.2" opacity="0.45" />
      <circle cx="725" cy="285" r="1.4" opacity="0.65" />
      <circle cx="1115" cy="145" r="1.8" opacity="0.55" />
      <circle cx="1135" cy="240" r="2.3" opacity="0.4" />
      <circle cx="755" cy="52" r="1.3" opacity="0.5" />
    </g>

    <!-- ================= LEFT TYPOGRAPHY HIERARCHY ================= -->
    <!-- Top Eyebrow -->
    <text x="48" y="47" font-family="&#39;Segoe UI&#39;, Arial, Helvetica, sans-serif" font-weight="700" font-size="13" letter-spacing="3.2" fill="#E3BA74">
      MOHAMED ATEF  <tspan fill="#64748B" font-weight="400">/</tspan>  <tspan fill="#CBD5E1">PERSONAL PORTFOLIO</tspan>
    </text>

    <!-- Main Hero Headline -->
    <text x="46" y="168" font-family="&#39;Segoe UI&#39;, Arial, Helvetica, sans-serif" font-weight="900" font-size="74" letter-spacing="-2" fill="#F8FAFC">
      LAW. CODE.
    </text>
    <text x="46" y="244" font-family="&#39;Segoe UI&#39;, Arial, Helvetica, sans-serif" font-weight="900" font-size="74" letter-spacing="-2.2" fill="url(#goldText)">
      INTELLIGENCE.
    </text>

    <!-- Subtitle -->
    <text x="48" y="290" font-family="&#39;Segoe UI&#39;, Arial, Helvetica, sans-serif" font-weight="400" font-size="18.5" letter-spacing="0.3" fill="#CBD5E1">
      Egyptian lawyer  <tspan fill="#DFB26B">•</tspan>  Legal technology engineer  <tspan fill="#DFB26B">•</tspan>  Applied AI
    </text>

    <!-- Glowing Gold Horizon Divider -->
    <rect x="48" y="318" width="620" height="2" fill="url(#goldBeam)" filter="url(#goldGlow)" />
    <circle cx="245" cy="319" r="3" fill="#FFF3D6" filter="url(#goldGlow)">
      <animate attributeName="cx" values="95;590;95" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Bottom Index Pillars -->
    <g font-family="&#39;Segoe UI&#39;, Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.6">
      <text x="48" y="378">
        <tspan font-weight="800" font-size="18" fill="#E5BA73">01</tspan>
        <tspan fill="#64748B" font-weight="400"> / </tspan>
        <tspan fill="#E2E8F0" font-weight="600">RESEARCH</tspan>
      </text>
      <text x="236" y="378">
        <tspan font-weight="800" font-size="18" fill="#E5BA73">02</tspan>
        <tspan fill="#64748B" font-weight="400"> / </tspan>
        <tspan fill="#E2E8F0" font-weight="600">SYSTEMS</tspan>
      </text>
      <text x="416" y="378">
        <tspan font-weight="800" font-size="18" fill="#E5BA73">03</tspan>
        <tspan fill="#64748B" font-weight="400"> / </tspan>
        <tspan fill="#E2E8F0" font-weight="600">AI</tspan>
      </text>
    </g>

    <!-- ================= RIGHT EMBLEM: CIRCUIT + HUD + SCALES ================= -->
    <g transform="translate(918, 206)">

      <!-- 1. Glowing Cyan PCB Circuit Traces Behind Scales -->
      <g stroke="#38BDF8" stroke-width="1.35" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" opacity="0.82">
        <!-- Left Circuit Traces -->
        <path d="M-125 -45 H-75 L-55 -25 H-18" />
        <path d="M-135 -15 H-62 L-44 3 H-15" />
        <path d="M-128 18 H-68 L-48 38 H-16" />
        <path d="M-110 52 H-58 L-38 72 H-15" />
        <path d="M-92 -78 H-48 L-28 -58 H-12" />
        <!-- Right Circuit Traces -->
        <path d="M125 -45 H75 L55 -25 H18" />
        <path d="M135 -15 H62 L44 3 H15" />
        <path d="M128 18 H68 L48 38 H16" />
        <path d="M110 52 H58 L38 72 H15" />
        <path d="M92 -78 H48 L28 -58 H12" />
        <!-- Circuit Terminal Nodes -->
        <g fill="#BAE6FD" stroke="none">
          <circle cx="-125" cy="-45" r="2.5" /><circle cx="-135" cy="-15" r="2.5" />
          <circle cx="-128" cy="18" r="2.5" /><circle cx="-110" cy="52" r="2.5" />
          <circle cx="-92" cy="-78" r="2.5" /><circle cx="125" cy="-45" r="2.5" />
          <circle cx="135" cy="-15" r="2.5" /><circle cx="128" cy="18" r="2.5" />
          <circle cx="110" cy="52" r="2.5" /><circle cx="92" cy="-78" r="2.5" />
        </g>
      </g>

      <!-- 2. Concentric Precision HUD & Orbital Rings -->
      <circle r="184" fill="none" stroke="url(#ringStroke)" stroke-width="1.2" opacity="0.5" />
      <circle r="174" fill="none" stroke="#DFB46E" stroke-width="2" stroke-dasharray="110 38 18 38 140 45" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite" />
      </circle>
      <circle r="161" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 7" opacity="0.65">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite" />
      </circle>
      <circle r="147" fill="none" stroke="#F8DBA4" stroke-width="1" stroke-dasharray="85 210 45 210" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite" />
      </circle>
      <circle r="134" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.35" />

      <!-- Left Golden Rim Flare -->
      <path d="M-128 -118 A174 174 0 0 0 -138 106" fill="none" stroke="#FFF1D0" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" opacity="0.85" />

      <!-- 3. Detailed 3D Metallic Brass Scales of Justice -->
      <g filter="url(#dropShadow)">
        <!-- Stepped Pedestal Base -->
        <rect x="-56" y="128" width="112" height="9" rx="4.5" fill="url(#brassMetal)" />
        <rect x="-44" y="119" width="88" height="9" rx="3.5" fill="url(#brassVertical)" />
        <path d="M-32 119 C-28 106, 28 106, 32 119 Z" fill="url(#brassMetal)" />
        <rect x="-18" y="102" width="36" height="6" rx="3" fill="url(#brassMetal)" />

        <!-- Central Pillar & Decorative Rings -->
        <rect x="-6.5" y="-114" width="13" height="216" rx="2" fill="url(#brassMetal)" />
        <line x1="-2" y1="-108" x2="-2" y2="98" stroke="#FFF4D8" stroke-width="1.2" opacity="0.65" />
        <!-- Pillar Collars -->
        <rect x="-11" y="42" width="22" height="6" rx="3" fill="url(#brassMetal)" />
        <rect x="-10" y="-22" width="20" height="5" rx="2.5" fill="url(#brassMetal)" />
        <rect x="-12" y="-86" width="24" height="7" rx="3.5" fill="url(#brassMetal)" />

        <!-- Top Finial Crown -->
        <polygon points="0,-138 -9,-122 9,-122" fill="url(#brassMetal)" />
        <circle cx="0" cy="-120" r="8.5" fill="url(#brassMetal)" />
        <circle cx="-2.5" cy="-122.5" r="2.5" fill="#FFF7E2" opacity="0.85" />

        <!-- Ornate Crossbeam -->
        <path d="M-98 -96 Q-48 -108 0 -96 Q48 -108 98 -96 L94 -89 Q48 -99 0 -89 Q-48 -99 -94 -89 Z" fill="url(#brassMetal)" />
        <!-- Center Fulcrum Hub -->
        <circle cx="0" cy="-93" r="11" fill="url(#brassVertical)" stroke="#FFE7BA" stroke-width="1.2" />
        <circle cx="0" cy="-93" r="4" fill="#FFF6DF" />
        <!-- Beam End Hooks -->
        <circle cx="-96" cy="-93" r="5" fill="url(#brassMetal)" />
        <circle cx="96" cy="-93" r="5" fill="url(#brassMetal)" />

        <!-- Left Scale Chains & Pan -->
        <g>
          <line x1="-96" y1="-88" x2="-132" y2="32" stroke="#E8C27E" stroke-width="1.5" stroke-dasharray="3 1.5" />
          <line x1="-96" y1="-88" x2="-60" y2="32" stroke="#C6964B" stroke-width="1.5" stroke-dasharray="3 1.5" />
          <line x1="-96" y1="-88" x2="-96" y2="34" stroke="#F8DBA4" stroke-width="1.2" opacity="0.8" />
          <!-- Pan Rim & Bowl -->
          <ellipse cx="-96" cy="33" rx="38" ry="4.5" fill="#FFE7BA" />
          <path d="M-134 33 C-128 53, -64 53, -58 33 Z" fill="url(#brassMetal)" />
        </g>

        <!-- Right Scale Chains & Pan -->
        <g>
          <line x1="96" y1="-88" x2="60" y2="32" stroke="#E8C27E" stroke-width="1.5" stroke-dasharray="3 1.5" />
          <line x1="96" y1="-88" x2="132" y2="32" stroke="#C6964B" stroke-width="1.5" stroke-dasharray="3 1.5" />
          <line x1="96" y1="-88" x2="96" y2="34" stroke="#F8DBA4" stroke-width="1.2" opacity="0.8" />
          <!-- Pan Rim & Bowl -->
          <ellipse cx="96" cy="33" rx="38" ry="4.5" fill="#FFE7BA" />
          <path d="M58 33 C64 53, 128 53, 134 33 Z" fill="url(#brassMetal)" />
        </g>
      </g>
    </g>

    <!-- ================= RIGHT CORNER METADATA ================= -->
    <text x="1154" y="47" text-anchor="end" font-family="&#39;Segoe UI&#39;, monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#CBD5E1">
      EG <tspan fill="#64748B">/</tspan> <tspan fill="#E3BA74">2026</tspan>
    </text>

    <text x="1154" y="378" text-anchor="end" font-family="&#39;Segoe UI&#39;, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#D4AA63">
      EVIDENCE <tspan fill="#38BDF8">→</tspan> ENGINEERING <tspan fill="#38BDF8">→</tspan> VERIFICATION
    </text>
  </g>
</svg>
