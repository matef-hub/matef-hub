<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Atef — Law. Code. Intelligence.</title>
<desc id="desc">Original dark editorial banner with bold typographic hierarchy, brass judicial scales and an animated circuit connecting legal expertise, engineering and applied AI.</desc>
<defs>
