<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">From source to verified legal research</title>
<desc id="desc">Original legal research flow: original legal source, text and provenance, Arabic retrieval and AI-assisted analysis, human legal review. No deployed model claims.</desc>
