<text x="48" y="56" font-family="Arial,sans-serif" font-weight="800" font-size="26" letter-spacing="-1" fill="#F2F5F7">EVIDENCE BEFORE AUTOMATION</text>
<text x="48" y="84" font-family="Arial,sans-serif" font-size="15" fill="#9DB6C8">A research method: transparent sources, traceable retrieval, human judgment.</text>
